<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supercool Bio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #2e1065, #0f172a, #030712);
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(139, 92, 246, 0.6);
      margin-bottom: 20px;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
    .role { color: #a78bfa; font-size: 0.9rem; margin-bottom: 16px; font-weight: 500; }
    .bio { color: #94a3b8; font-size: 0.92rem; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://githubusercontent.com" alt="Avatar" class="avatar">
    <h1>Your Name</h1>
    <div class="role">Full-Stack Creator</div>
    <p class="bio">Building cool web things, breaking code, and fixing it twice as fast.</p>
    <div class="links">
      <a href="https://github.com" class="btn">GitHub</a>
      <a href="https://twitter.com" class="btn">Twitter / X</a>
      <a href="mailto:you@example.com" class="btn">Email Me</a>
    </div>
  </div>
</body>
</html>
