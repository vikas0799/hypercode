<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color List</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .color-grid {
      display: grid;

      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .color-box {
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color:rgb(0, 8, 255);
      border: 1px solid gray;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: gray;
    }
  </style>
</head>
<body>

  <h1>Color List</h1>

  <div class="color-grid">
    <div class="color-box" style="background-color: red;">Red</div>
    <div class="color-box" style="background-color: pink; color: black;">Pink</div>
    <div class="color-box" style="background-color: green;">Green</div>
    <div class="color-box" style="background-color: blue;">Blue</div>
    <div class="color-box" style="background-color: orange;">Orange</div>
    <div class="color-box" style="background-color: yellow; color: black;">Yellow</div>
    <div class="color-box" style="background-color: purple;">Purple</div>
    <div class="color-box" style="background-color: cyan; color: black;">Cyan</div>
    <div class="color-box" style="background-color: magenta;">Magenta</div>
    <div class="color-box" style="background-color: brown;">Brown</div>
    <div class="color-box" style="background-color: teal;">Teal</div>
    <div class="color-box" style="background-color: grey;">Grey</div>
  </div>

  <div class="actions">
    <button onclick="alert('Button clicked!')">Action Button</button>
  </div>

</body>
</html>
